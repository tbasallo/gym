name: Build and deploy

# Builds and tests every push and pull request. Deploys to Azure App Service only when:
#   - the run is a push to main, or a manual run (Actions > Build and deploy > Run workflow)
#     with "deploy" ticked, and
#   - the AZURE_WEBAPP_NAME repository variable is set.
# The App Service publish profile comes from the AZURE_WEBAPP_PUBLISH_PROFILE secret.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Azure after a successful build
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT: src/Gym.Web/Gym.Web.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Publish
        run: dotnet publish ${{ env.PROJECT }} -c Release -o publish

      - uses: actions/upload-artifact@v5
        with:
          name: app
          path: publish
          retention-days: 7

  deploy:
    needs: build
    if: >-
      vars.AZURE_WEBAPP_NAME != '' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Check publish profile
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "$PUBLISH_PROFILE" ]; then
            echo "::error::Secret AZURE_WEBAPP_PUBLISH_PROFILE is not set. Download the publish profile from the App Service overview page and save it as a repository (or 'production' environment) secret."
            exit 1
          fi

      - uses: actions/download-artifact@v5
        with:
          name: app
          path: publish

      - name: Deploy to ${{ vars.AZURE_WEBAPP_NAME }}
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
